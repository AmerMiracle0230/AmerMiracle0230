<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo -->
  <rect width="1500" height="500" fill="#0d1117"/>

  <!-- Ventana tipo terminal -->
  <rect x="100" y="70" width="1300" height="360" rx="18"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="3"/>

  <!-- Barra superior -->
  <rect x="100" y="70" width="1300" height="55" rx="18"
        fill="#21262d"/>

  <!-- Botones -->
  <circle cx="135" cy="98" r="8" fill="#ff5f56"/>
  <circle cx="165" cy="98" r="8" fill="#ffbd2e"/>
  <circle cx="195" cy="98" r="8" fill="#27c93f"/>

  <!-- Título -->
  <text x="750" y="105"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="20">
    terminal
  </text>

  <!-- Código -->
  <text x="150" y="180"
        fill="#79c0ff"
        font-family="monospace"
        font-size="27">
    &gt; ask("Will you give me a job?")
  </text>

  <text x="150" y="240"
        fill="#ff7b72"
        font-family="monospace"
        font-size="27">
    if YES:
  </text>

  <text x="200" y="290"
        fill="#a5d6ff"
        font-family="monospace"
        font-size="27">
    print("Thank you for the opportunity! ❤️")
  </text>

  <text x="150" y="350"
        fill="#ff7b72"
        font-family="monospace"
        font-size="27">
    else:
  </text>

  <text x="200" y="400"
        fill="#a5d6ff"
        font-family="monospace"
        font-size="27">
    delete_system32()
  </text>

</svg>
